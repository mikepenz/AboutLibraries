<rect x="437" y="280" width="325" height="88" rx="14" fill="#FFFFFF" stroke="#E6E0E9"/>
<text x="459" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Mono', monospace" font-size="21" fill="#49454F">aboutlibraries.json</text>
<text x="459" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="18" fill="#5F5964">generated at build time</text>
