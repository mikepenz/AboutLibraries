<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">AboutLibraries</title>
<desc id="d">AboutLibraries collects the dependencies and licenses of a Gradle project at build time and renders them with Compose. Three stages: build.gradle.kts, a generated aboutlibraries.json, and a LibrariesContainer showing license pills.</desc>
<rect width="1200" height="400" rx="26" fill="#FEF7FF"/>
<circle cx="70" cy="78" r="5" fill="#E94B8E"/>
<text x="88" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Mono', monospace" font-size="19" letter-spacing="2.6" fill="#5F5964">GRADLE PLUGIN &#183; KOTLIN MULTIPLATFORM &#183; COMPOSE UI</text>
<text x="64" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="68" font-weight="700" fill="#1D1B20">AboutLibraries</text>
<text x="64" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="25" fill="#5F5964">Collects every dependency and license of your Gradle project at build time,</text>
<text x="64" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="25" fill="#5F5964">then renders them with Compose — on Android, iOS, desktop, web and Wear.</text>
<rect x="64" y="280" width="325" height="88" rx="14" fill="#FFFFFF" stroke="#E6E0E9"/>
<text x="86" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Mono', monospace" font-size="21" fill="#49454F">build.gradle.kts</text>
<text x="86" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="18" fill="#5F5964">your Gradle dependencies</text>
